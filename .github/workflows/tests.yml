name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        # Typer force-enables Rich colored output when GITHUB_ACTIONS is set,
        # which injects ANSI codes into CLI error text and breaks the plain-
        # substring assertions in tests/test_cli.py. GitHub re-injects
        # GITHUB_ACTIONS into every step's environment (a step-level `env:`
        # block can't override it), so unset it for just the pytest process.
        run: env -u GITHUB_ACTIONS pytest
