name: Publish to PyPI

on:
  release:
    types: [published]

# Default token permissions: read-only. The publish job below grants
# id-token: write so PyPI can verify the OIDC identity via trusted publishing.
permissions: {}

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing - no API tokens stored
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pyproj" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (=$tag) does not match pyproject version '$pyproj'"
            exit 1
          fi
          echo "Tag and pyproject version match: $tag"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
