[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpts-lab-tools"
version = "0.3.0"
description = "Minimal CLI helpers for authorized penetration-testing lab organization and reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
cpts-tools = "cpts_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cpts_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Basic, low-noise rule set: pyflakes (F) + import-related/statement/syntax
# pycodestyle errors (E4/E7/E9) + import sorting (I). E501 is intentionally
# left out — workflow methodology strings are long-form data, not code.
select = ["E4", "E7", "E9", "F", "I"]
