[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconlab"
version = "0.11.0"
description = "Minimal CLI helpers for authorized penetration-testing lab organization and reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xsl0th" }]
keywords = ["pentest", "security", "methodology", "nmap", "workflow", "cli", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/0xsl0th/reconlab"
Repository = "https://github.com/0xsl0th/reconlab"
Changelog = "https://github.com/0xsl0th/reconlab/blob/main/CHANGELOG.md"
Issues = "https://github.com/0xsl0th/reconlab/issues"

[project.scripts]
reconlab = "reconlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reconlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Basic, low-noise rule set: pyflakes (F) + import-related/statement/syntax
# pycodestyle errors (E4/E7/E9) + import sorting (I). E501 is intentionally
# left out - workflow methodology strings are long-form data, not code.
select = ["E4", "E7", "E9", "F", "I"]
