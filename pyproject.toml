[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpts-lab-tools"
version = "0.1.0"
description = "Minimal CLI helpers for authorized HTB/CPTS lab organization and reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cpts-tools = "cpts_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cpts_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
